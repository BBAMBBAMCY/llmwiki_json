services:
  viewer:
    build:
      context: ..
      dockerfile: viewer/Dockerfile
      target: viewer
    image: llmwiki-json-viewer:latest
    container_name: llmwiki-json-viewer
    restart: unless-stopped
    depends_on:
      - watcher
    ports:
      - "4173:80"
    volumes:
      # 이미지에 구운 데이터 대신 호스트의 산출물을 그대로 본다.
      # watcher 가 이 디렉터리를 갱신하면 뷰어가 새로고침 없이 따라온다.
      # 분리 모드: LLMWIKI_VIEWER_DATA=<data>/.llmwiki/viewer-data
      - ${LLMWIKI_VIEWER_DATA:-../viewer/public/data}:/usr/share/nginx/html/data:ro

  watcher:
    build:
      context: ..
      dockerfile: viewer/Dockerfile
      target: watcher
    image: llmwiki-json-watcher:latest
    container_name: llmwiki-json-watcher
    restart: unless-stopped
    environment:
      LLMWIKI_ROOT: /data
    volumes:
      # 코드 repo 와 데이터 root. 분리 모드: LLMWIKI_DATA=<data repo 경로> (기본은 이 저장소 = 단일 repo 모드)
      - ..:/repo
      - ${LLMWIKI_DATA:-..}:/data
