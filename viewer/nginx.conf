server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/javascript application/json image/svg+xml text/css text/plain;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 파생 데이터는 호스트에서 bind mount 로 들어온다. 캐시하면 갱신이 보이지 않는다.
    location /data/ {
        try_files $uri =404;
        add_header Cache-Control "no-store";
        expires -1;
    }

    # 뷰어 검색은 색인(`llmwiki.py query`)을 탄다. watcher 가 그 CLI 를 연다.
    location /api/query {
        proxy_pass http://watcher:8788/query;
        proxy_http_version 1.1;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
